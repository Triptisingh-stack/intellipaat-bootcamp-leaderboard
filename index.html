<body>

    <section class="hero">

        <h1>Intellipaat School of Technology</h1>

        <p class="tagline">
            Code • Develop • Succeed
        </p>

        <div class="bootcamp-title">
            🏆 Bootcamp Leaderboard
        </div>

        <div class="search-container">

            <input
                type="email"
                id="searchEmail"
                placeholder="Enter your registered email">

            <button onclick="findRank()">
                Find My Rank
            </button>

        </div>

    </section>

    <div id="studentCard"></div>

    <section class="leaderboard-section">

        <h2>Leaderboard Rankings</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Badge</th>
                    </tr>

                </thead>

                <tbody id="leaderboardBody">

                </tbody>

            </table>

        </div>

    </section>

    <script src="script.js"></script>

</body>
