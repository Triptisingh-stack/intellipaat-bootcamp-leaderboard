<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intellipaat School of Technology | Bootcamp Leaderboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- HERO SECTION -->

    <section class="hero">

        <h1>Intellipaat School of Technology</h1>

        <p class="tagline">
            Code • Develop • Succeed
        </p>

        <div class="bootcamp-title">
            🏆 Bootcamp Leaderboard
        </div>

        <div class="search-container">

            <input
                type="email"
                id="searchEmail"
                placeholder="Enter your registered email">

            <button onclick="findRank()">
                Find My Rank
            </button>

        </div>

    </section>

    <!-- STUDENT RESULT CARD -->

    <div id="studentCard"></div>

    <!-- LEADERBOARD -->

    <section class="leaderboard-section">

        <h2>Leaderboard Rankings</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Badge</th>
                    </tr>

                </thead>

                <tbody id="leaderboardBody">

                    <!-- Data loads from Google Sheets -->

                </tbody>

            </table>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
